{% extends 'base.html' %}
{% block content %}

<div style="display:flex;justify-content:center;padding:24px 0">
  <div style="background:white;border-radius:16px;border:1px solid #e2e8f0;padding:36px 32px;width:100%;max-width:420px">
    <h2 style="font-size:20px;font-weight:700;color:#1e1b4b;margin-bottom:4px">Hesap Oluştur</h2>
    <p style="color:#94a3b8;font-size:14px;margin-bottom:24px">Ücretsiz kayıt ol, test oluştur</p>

    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div style="margin-bottom:16px">
          <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div style="color:#dc2626;font-size:12px;margin-top:4px">{{ field.errors.as_text }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn-main" style="width:100%;margin-top:4px;text-align:center">Kayıt Ol</button>
    </form>

    <p style="text-align:center;font-size:13px;color:#94a3b8;margin-top:16px">
      Hesabın var mı? <a href="{% url 'login' %}" style="color:#4f46e5;font-weight:500;text-decoration:none">Giriş yap</a>
    </p>
  </div>
</div>

<style>
  input, select { width:100%; padding:10px 13px; border:1.5px solid #e2e8f0; border-radius:9px; font-size:14px; color:#1e293b; outline:none; }
  input:focus, select:focus { border-color:#4f46e5; }
</style>

{% endblock %}
