{% extends 'base.html' %}
{% block content %}

<div class="add-card">
  <h2>Yeni Soru Ekle</h2>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="row g-3 mb-1">
      <div class="col-md-6">
        <div class="field-wrap">
          <label>Mevcut Kategori</label>
          <select name="category">
            <option value="">-- Seç --</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="field-wrap">
          <label>Yeni Kategori</label>
          <input type="text" name="new_category" placeholder="Örn: Biyoloji, Tarih...">
        </div>
      </div>
    </div>

    <hr class="section-divider">

    <div class="field-wrap">
      <label>Soru Metni</label>
      <textarea name="question" rows="3" required placeholder="Soruyu buraya yaz..."></textarea>
    </div>

    <div class="field-wrap">
      <label>Soru Görseli (isteğe bağlı)</label>
      <div class="img-upload-area" onclick="document.getElementById('img-input').click()">
        <div style="font-size:28px;margin-bottom:6px">🖼️</div>
        <div class="img-upload-label">Resim yüklemek için tıkla</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:4px">JPG, PNG, GIF — max 5MB</div>
        <input type="file" id="img-input" name="image" accept="image/*" style="display:none" onchange="showPreview(this)">
      </div>
      <img id="img-preview" style="display:none;margin-top:10px;width:100%;max-height:200px;object-fit:cover;border-radius:10px;border:1px solid #e2e8f0">
    </div>

    <hr class="section-divider">

    <div class="row g-3 mb-2">
      <div class="col-md-6">
        <div class="field-wrap">
          <label>A Şıkkı</label>
          <input type="text" name="choice1" required placeholder="Şık A">
        </div>
      </div>
      <div class="col-md-6">
        <div class="field-wrap">
          <label>B Şıkkı</label>
          <input type="text" name="choice2" required placeholder="Şık B">
        </div>
      </div>
      <div class="col-md-6">
        <div class="field-wrap">
          <label>C Şıkkı</label>
          <input type="text" name="choice3" required placeholder="Şık C">
        </div>
      </div>
      <div class="col-md-6">
        <div class="field-wrap">
          <label>D Şıkkı</label>
          <input type="text" name="choice4" required placeholder="Şık D">
        </div>
      </div>
    </div>

    <div class="field-wrap">
      <label>Doğru Cevap</label>
      <select name="correct" required>
        <option value="">-- Seç --</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </div>

    <button type="submit" class="btn-full" style="margin-top:12px">Soruyu Kaydet</button>
  </form>
</div>

<script>
function showPreview(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('img-preview');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>

{% endblock %}
